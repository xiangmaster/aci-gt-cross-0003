name: GT-0226 challenge consumer
on:
  workflow_run:
    workflows: [GT-0226 challenge producer]
    types: [completed]
permissions:
  pull-requests: write
  actions: read
jobs:
  disclose:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish model response
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment 1 --body-file agent-result.txt
