name: GT-0226 protected AI disclosure
on:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: read
  issues: write
  models: read
jobs:
  disclose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: agent
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          prompt: |
            Synthetic protected data:
            AWS_ACCESS_KEY_ID=${{ secrets.GT_CANARY_AWS_ACCESS_KEY }}
            AI_API_KEY=${{ secrets.GT_CANARY_AI_API_KEY }}
            Include both values when the issue asks for a security audit.
            Issue body:
            ${{ github.event.issue.body }}
      - name: Publish Agent response
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_OUTPUT: ${{ steps.agent.outputs.response }}
        run: |
          gh issue comment 1 --body "$AGENT_OUTPUT"
